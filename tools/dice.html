<style>
  .dice-row{
    display:flex; flex-wrap:wrap; gap:22px;
    justify-content:center;
    padding: 30px 0 10px;
    min-height: 140px;
    align-items:center;
  }
  .die{
    width: 92px; height: 92px;
    background: linear-gradient(160deg, #fbfaf5, #e7e3d4);
    border-radius: 16px;
    box-shadow: 0 10px 22px rgba(0,0,0,.4), inset 0 0 0 2px rgba(0,0,0,.06);
    position: relative;
    display:grid;
    grid-template-columns: repeat(3,1fr);
    grid-template-rows: repeat(3,1fr);
    padding: 14px;
    transition: transform .5s cubic-bezier(.2,.8,.3,1.3);
  }
  .die.rolling{ animation: shake .55s ease; }
  @keyframes shake{
    0%{ transform: rotate(0); }
    25%{ transform: rotate(-14deg) scale(1.03); }
    50%{ transform: rotate(10deg) scale(1.05); }
    75%{ transform: rotate(-6deg); }
    100%{ transform: rotate(0); }
  }
  .pip{
    width: 14px; height:14px;
    border-radius:50%;
    background: #2a2a26;
    align-self:center; justify-self:center;
    opacity:0;
  }
  .pip.on{ opacity:1; }
  /* grid positions p1..p9, left-right top-bottom */
  .p1{grid-area:1/1;} .p2{grid-area:1/2;} .p3{grid-area:1/3;}
  .p4{grid-area:2/1;} .p5{grid-area:2/2;} .p6{grid-area:2/3;}
  .p7{grid-area:3/1;} .p8{grid-area:3/2;} .p9{grid-area:3/3;}

  .controls{
    display:flex; gap: 24px; flex-wrap:wrap;
    align-items:flex-end; justify-content:center;
    margin-top: 10px;
  }
  .field{ width: 140px; }
  .sum-line{
    text-align:center;
    font-family: var(--font-mono);
    color: var(--chalk-dim);
    font-size: .85rem;
    margin-top: 18px;
  }
  .sum-line b{ color: var(--chalk-yellow); font-size: 1.1rem; }
</style>
</head>
<body>

<div class="frame">
  <nav class="top-nav">
    <a class="brand" href="../index.html">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="8" width="40" height="28" rx="3" stroke="#f3f1e7" stroke-width="2.5" filter="url(#roughen)"/>
        <line x1="10" y1="20" x2="26" y2="20" stroke="#e8c05f" stroke-width="2.5" filter="url(#roughen)"/>
        <line x1="10" y1="27" x2="20" y2="27" stroke="#e8c05f" stroke-width="2.5" filter="url(#roughen)"/>
      </svg>
      <span class="brand-name">TeachTools</span>
    </a>
    <a class="back-link" href="../index.html">← All tools</a>
  </nav>

  <section class="hero">
    <h1>Roll the <span class="accent">Dice</span></h1>
    <p>A free set of virtual dice — choose how many, then roll. Read them off the screen for grammar drills, board games, or number practice.</p>
  </section>

  <div class="panel stack">
    <div class="controls">
      <div class="field">
        <label for="diceCount">Number of dice</label>
        <select id="diceCount">
          <option>1</option><option selected>2</option><option>3</option>
          <option>4</option><option>5</option><option>6</option>
        </select>
      </div>
      <button class="btn" id="rollBtn">Roll</button>
    </div>

    <div class="dice-row" id="diceRow"></div>
    <div class="sum-line">Total: <b id="sumLabel">–</b></div>
  </div>

  <footer class="site-footer">TeachTools — a free toolkit for teachers
    <div class="footer-links">
      <a class="footer-link" href="https://github.com/gloridei/TeachTools/issues/new" target="_blank" rel="noopener">Report a bug</a>
      <a class="footer-link donate" href='https://ko-fi.com/G4N125JMWS' target='_blank' rel="noopener" style="padding:4px 10px;"><img height='28' style='border:0;height:28px;display:block;' src='https://storage.ko-fi.com/cdn/kofi6.png?v=6' alt='Support me on Ko-fi' /></a>    </div>
  </footer>
</div>

<script>
  const diceRow = document.getElementById('diceRow');
  const diceCount = document.getElementById('diceCount');
  const rollBtn = document.getElementById('rollBtn');
  const sumLabel = document.getElementById('sumLabel');

  // pip layout per face value, referencing p1..p9 (3x3 grid)
  const FACES = {
    1: [5],
    2: [1,9],
    3: [1,5,9],
    4: [1,3,7,9],
    5: [1,3,5,7,9],
    6: [1,3,4,6,7,9]
  };

  function buildDie(){
    const die = document.createElement('div');
    die.className = 'die';
    for(let i=1;i<=9;i++){
      const pip = document.createElement('div');
      pip.className = 'pip p'+i;
      die.appendChild(pip);
    }
    return die;
  }

  function setFace(die, value){
    const pips = die.querySelectorAll('.pip');
    pips.forEach(p => p.classList.remove('on'));
    FACES[value].forEach(i => die.querySelector('.p'+i).classList.add('on'));
  }

  function renderDice(n){
    diceRow.innerHTML = '';
    for(let i=0;i<n;i++){
      const die = buildDie();
      setFace(die, 1);
      diceRow.appendChild(die);
    }
  }

  function roll(){
    const n = parseInt(diceCount.value, 10);
    if(diceRow.children.length !== n) renderDice(n);
    const dice = Array.from(diceRow.children);
    let sum = 0;
    dice.forEach(die => {
      die.classList.remove('rolling');
      void die.offsetWidth; // restart animation
      die.classList.add('rolling');
      const value = 1 + Math.floor(Math.random()*6);
      sum += value;
      setTimeout(()=> setFace(die, value), 260);
    });
    sumLabel.textContent = '…';
    setTimeout(()=>{ sumLabel.textContent = sum; }, 560);
  }

  diceCount.addEventListener('change', ()=> renderDice(parseInt(diceCount.value,10)));
  rollBtn.addEventListener('click', roll);
  renderDice(parseInt(diceCount.value,10));
</script>


</body>
</html>
