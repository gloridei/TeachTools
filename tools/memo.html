<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Memo — Chalk &amp; Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  .memo-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 820px){
    .memo-grid{ grid-template-columns: 1fr; }
  }
  .memo-card{
    background: var(--board-light);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,.06);
    border-top: 4px solid var(--accent, var(--chalk-yellow));
    display:flex; flex-direction:column; gap:10px;
  }
  .memo-card h3{
    font-family: var(--font-display);
    font-size: 1.6rem;
    margin:0;
    color: var(--chalk);
  }
  .memo-card textarea{
    flex:1;
    min-height: 220px;
    background: transparent;
    border: none;
    font-family: var(--font-display);
    font-size: 1.35rem;
    line-height: 1.4;
    color: var(--chalk);
    padding: 0;
  }
  .memo-card textarea:focus{ outline:none; }
  .memo-card.warmup{ --accent: var(--chalk-coral); }
  .memo-card.homework{ --accent: var(--chalk-blue); }
  .memo-card.reminders{ --accent: var(--chalk-yellow); }
  .status-line{
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--chalk-dim);
    text-align:center;
    margin-top: 22px;
  }
</style>
</head>
<body>

<div class="frame">
  <nav class="top-nav">
    <a class="brand" href="../index.html">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="8" width="40" height="28" rx="3" stroke="#f3f1e7" stroke-width="2.5" filter="url(#roughen)"/>
        <line x1="10" y1="20" x2="26" y2="20" stroke="#e8c05f" stroke-width="2.5" filter="url(#roughen)"/>
        <line x1="10" y1="27" x2="20" y2="27" stroke="#e8c05f" stroke-width="2.5" filter="url(#roughen)"/>
      </svg>
      <span class="brand-name">TeachTools</span>
    </a>
    <a class="back-link" href="../index.html">← All tools</a>
  </nav>

  <section class="hero">
    <h1>Class <span class="accent">Memo</span></h1>
    <p>Three boards for the things you write on the wall every lesson. Type, and it saves itself on this device.</p>
  </section>

  <div class="memo-grid no-print">
    <div class="memo-card warmup">
      <h3>Warm-up</h3>
      <textarea id="memo-warmup" placeholder="e.g. Discuss with a partner: what did you do last weekend?"></textarea>
    </div>
    <div class="memo-card homework">
      <h3>Homework</h3>
      <textarea id="memo-homework" placeholder="e.g. Workbook p.24, exercises 1–3"></textarea>
    </div>
    <div class="memo-card reminders">
      <h3>Reminders</h3>
      <textarea id="memo-reminders" placeholder="e.g. Bring dictionaries next class"></textarea>
    </div>
  </div>

  <div class="btn-row center no-print" style="margin-top:24px;">
    <button class="btn secondary" id="printBtn">Print board</button>
    <button class="btn secondary" id="clearBtn">Clear all</button>
  </div>

  <div class="status-line no-print" id="statusLine">All changes save automatically on this device.</div>

  <footer class="site-footer no-print">Chalk &amp; Board — a free toolkit for ESL teachers
    <div class="footer-links">
      <a class="footer-link" href="https://github.com/gloridei/TeachTools/issues/new" target="_blank" rel="noopener">Report a bug</a>
      <a class="footer-link donate" href='https://ko-fi.com/G4N125JMWS' target='_blank' rel="noopener" style="padding:4px 10px;"><img height='28' style='border:0;height:28px;display:block;' src='https://storage.ko-fi.com/cdn/kofi6.png?v=6' alt='Support me on Ko-fi' /></a>    </div>
  </footer>
</div>

<script>
  const ids = ['memo-warmup','memo-homework','memo-reminders'];
  const statusLine = document.getElementById('statusLine');
  let storageWorks = true;

  function tryStorage(fn, fallback){
    try{ return fn(); } catch(e){ storageWorks = false; return fallback; }
  }

  function load(){
    ids.forEach(id=>{
      const el = document.getElementById(id);
      const saved = tryStorage(()=> localStorage.getItem(id), null);
      if(saved !== null) el.value = saved;
    });
    if(!storageWorks){
      statusLine.textContent = 'Autosave is unavailable in this preview — open the downloaded file in your own browser to save.';
    }
  }

  function save(id, value){
    tryStorage(()=> localStorage.setItem(id, value), null);
  }

  ids.forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('input', ()=> save(id, el.value));
  });

  document.getElementById('clearBtn').addEventListener('click', ()=>{
    if(!confirm('Clear all three boards?')) return;
    ids.forEach(id=>{
      document.getElementById(id).value = '';
      save(id, '');
    });
  });

  document.getElementById('printBtn').addEventListener('click', ()=> window.print());

  load();
</script>


</body>
</html>
