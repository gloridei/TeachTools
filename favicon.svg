<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- blackboard background -->
  <rect width="64" height="64" rx="14" fill="#24332B"/>
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="#6b4a34" stroke-width="3"/>

  <!-- chalk-style die -->
  <g transform="rotate(-8 32 32)">
    <rect x="16" y="16" width="32" height="32" rx="6"
          fill="none" stroke="#f3f1e7" stroke-width="3.2" stroke-linejoin="round"/>
    <circle cx="24" cy="24" r="3.1" fill="#e8c05f"/>
    <circle cx="40" cy="24" r="3.1" fill="#e8c05f"/>
    <circle cx="24" cy="40" r="3.1" fill="#e2836f"/>
    <circle cx="40" cy="40" r="3.1" fill="#e2836f"/>
    <circle cx="32" cy="32" r="3.1" fill="#8db4d4"/>
  </g>
</svg>
